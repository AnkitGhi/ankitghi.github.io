<svg xmlns="http://www.w3.org/2000/svg" width="460" height="400" viewBox="0 0 460 400" fill="none">
  <title>Current focus — a causality research board</title>
  <desc>A newspaper draft, causal diagram, and handwritten research notes pinned to a blue newsroom board.</desc>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" stroke="#527389" stroke-opacity=".24" stroke-width=".6"/></pattern>
    <pattern id="note-lines" width="140" height="22" patternUnits="userSpaceOnUse"><path d="M0 21H140" stroke="#d5b95d" stroke-opacity=".35"/></pattern>
    <filter id="paper-shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#061f32" flood-opacity=".22"/></filter>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m1 1 6 3-6 3" stroke="#395b70" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <!-- A quiet newsroom pinboard; the papers do the storytelling. -->
  <rect x="8" y="12" width="444" height="374" rx="5" fill="#335368" stroke="#1d3d53" stroke-width="2"/>
  <rect x="14" y="18" width="432" height="362" rx="2" fill="url(#grid)"/>
  <path d="M22 28H438M22 370H438" stroke="#78909d" stroke-opacity=".35"/>
  <g fill="#b6c3c9"><circle cx="20" cy="24" r="2"/><circle cx="440" cy="24" r="2"/><circle cx="20" cy="374" r="2"/><circle cx="440" cy="374" r="2"/></g>
  <!-- The feature, still very much a draft. -->
  <g transform="rotate(-3 165 191)" filter="url(#paper-shadow)">
    <path d="M38 42H304V332L297 335 291 332 285 335 279 332 273 335 267 332 261 335 255 332 249 335H38Z" fill="#fcfcf5"/>
    <g transform="translate(56 58)" stroke="#233e50" stroke-width="1.5" stroke-linecap="round">
      <path d="M5 12V5h7M22 5h7v7M29 22v7h-7M12 29H5v-7"/>
      <circle cx="17" cy="17" r="5"/>
      <circle cx="17" cy="17" r="1.5" fill="#233e50" stroke="none"/>
    </g>
    <text x="97" y="78" fill="#213c4f" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" letter-spacing="-.8">Current focus</text>
    <path d="M53 91H288M53 94H288" stroke="#233e50" stroke-width=".8"/>
    <text x="55" y="107" fill="#536675" font-family="monospace" font-size="7.8" letter-spacing="1">SCIENCE DESK</text>
    <text x="287" y="107" fill="#536675" font-family="monospace" font-size="7.8" text-anchor="end">DRAFT / 01</text>
    <text x="54" y="143" fill="#213c4f" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700">Beyond</text>
    <text x="54" y="173" fill="#213c4f" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700">correlation.</text>
    <path d="M53 180Q148 175 222 180" stroke="#c84648" stroke-width="2" stroke-linecap="round"/>
    <text x="54" y="200" fill="#526575" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic">Following the cause, not just the clues.</text>
    <!-- A common cause creates a backdoor path: Z → X, Z → Y, X → Y. -->
    <g stroke="#395b70" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M160 237 113 263"/><path d="m185 237 46 26"/><path d="M124 277h92"/>
    </g>
    <g fill="#e9f0f2" stroke="#8096a1"><circle cx="172" cy="229" r="15"/><circle cx="107" cy="277" r="16"/><circle cx="237" cy="277" r="16"/></g>
    <g fill="#233e50" font-family="Georgia, serif" font-style="italic" font-size="17" text-anchor="middle"><text x="172" y="235">Z</text><text x="107" y="283">X</text><text x="237" y="283">Y</text></g>
    <g fill="#526575" font-family="monospace" font-size="8" text-anchor="middle"><text x="107" y="309">CAUSE</text><text x="237" y="309">EFFECT</text></g>
    <path d="M53 320H287" stroke="#b6c0c3"/>
  </g>
  <!-- A single red thread leads from the draft to the intervention note. -->
  <path d="M169 42C247 16 283 38 361 98" stroke="#142e40" stroke-opacity=".3" stroke-width="3"/>
  <path d="M169 40C247 14 283 36 361 96" stroke="#db6d65" stroke-width="1.4"/>
  <g transform="rotate(6 360 159)" filter="url(#paper-shadow)">
    <path d="M295 91H429V211L415 225H295Z" fill="#fff0ac"/>
    <path d="m415 225 1-15 13 1" fill="#e7d88f"/>
    <rect x="303" y="118" width="115" height="88" fill="url(#note-lines)"/>
    <text x="308" y="127" fill="#7b6538" font-family="monospace" font-size="8" letter-spacing="1">THE QUESTION</text>
    <g fill="#374653" font-family="Georgia, serif" font-size="18" font-style="italic"><text x="309" y="153">What changes</text><text x="309" y="176">when we</text><text x="309" y="199">intervene?</text></g>
  </g>
  <g transform="rotate(3 352 294)" filter="url(#paper-shadow)">
    <rect x="282" y="251" width="140" height="94" fill="#ecf4f7"/>
    <rect x="319" y="244" width="56" height="15" fill="#e6edf0" fill-opacity=".75" transform="rotate(-8 347 251)"/>
    <text x="296" y="275" fill="#536c7c" font-family="monospace" font-size="8" letter-spacing="1">NEXT LEAD</text>
    <text x="296" y="299" fill="#2d4b5e" font-family="Georgia, serif" font-size="14" font-style="italic">A new setting.</text>
    <text x="296" y="321" fill="#2d4b5e" font-family="Georgia, serif" font-size="14" font-style="italic">Does it still hold?</text>
    <path d="M296 326q47 3 99-1" stroke="#a34e4e" stroke-width="1.2"/>
  </g>
  <g filter="url(#paper-shadow)"><circle cx="169" cy="40" r="5" fill="#ca4b4c"/><circle cx="361" cy="96" r="5" fill="#ca4b4c"/><circle cx="167.5" cy="38.5" r="1.5" fill="#f0b0a1"/><circle cx="359.5" cy="94.5" r="1.5" fill="#f0b0a1"/></g>
</svg>
